<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LHQ Hub</title>
<link rel="icon" href="arrow.png">
<link rel="apple-touch-icon" href="logo.png">
<script>
/* Links made before LHQ Hub (student checklists) open the document editor */
if(/^#(import=)/.test(location.hash)) location.replace('editor.html' + location.hash);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="theme.js"></script>
<script src="sync.js"></script>
<style>
:root{--navy:#073763;--gold:#f4b223;--wa:#1f9d55;
  --bg:#f5f6f8;--surface:#fff;--surface2:#fafbfc;--ink:#14213d;--muted:#6b7585;--line:#e4e7ec;--line2:#eef0f3;--field:#fff;--accent:#073763;--onaccent:#fff;--brand:#073763;
  --ok-bg:#e6f4ec;--ok:#1f7a4d;--rd-bg:#fdecea;--rd:#b42318;--am-bg:#fdf3d9;--am:#7a5400;--bl-bg:#eaf0f7;--bl:#073763;--gr-bg:#f1f3f6;--gr:#6b7482}
[data-theme=dark]{--bg:#0d1420;--surface:#151e2c;--surface2:#1a2433;--ink:#e8edf4;--muted:#93a0b3;--line:#253246;--line2:#1f2a3a;--field:#111a27;--accent:#f4b223;--onaccent:#0d1420;--brand:#e8edf4;
  --ok-bg:rgba(52,168,103,.16);--ok:#5fd093;--rd-bg:rgba(240,82,70,.16);--rd:#ff8a80;--am-bg:rgba(244,178,35,.16);--am:#f4c35a;--bl-bg:rgba(120,165,220,.16);--bl:#a9c6ea;--gr-bg:#1f2a3a;--gr:#93a0b3;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100dvh}
svg{display:block}
a{color:inherit}
button{font:inherit;cursor:pointer;color:inherit}
[hidden]{display:none!important}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.topbar .lg img{height:40px;display:block}
.topbar .actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;flex:none;padding:0}
.hub-acct{font-weight:700;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:8px 13px;min-height:38px}
.tabs{display:none;gap:4px;margin-left:18px}
.tabs a{text-decoration:none;font-weight:700;color:var(--muted);padding:8px 13px;border-radius:99px;font-size:14px}
.tabs a.on{background:var(--surface);color:var(--brand);box-shadow:0 0 0 1px var(--line)}

/* page */
.main{max-width:720px;margin:0 auto;padding:4px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.hi h1{margin:8px 2px 0;font-size:24px;font-weight:800;letter-spacing:-.3px;color:var(--brand)}
.hi p{margin:2px 2px 16px;color:var(--muted);font-size:13.5px}
.crumb{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--muted);font-weight:700;font-size:13.5px;padding:6px 0;margin-top:2px;text-decoration:none}
.qk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.qk a{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 0 11px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--ink);text-decoration:none}
.qk a svg{color:var(--brand)}
.pn{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 14px;margin-bottom:16px}
.pn.pad{padding:14px}
.h2{font-size:13px;font-weight:800;margin:4px 2px 8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.h2 em{font-style:normal;color:var(--muted);font-weight:700}
.pn .h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:10px 0 4px}
.it{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line2);text-decoration:none;color:inherit}
.it:first-child,.h2+.it{border-top:0}
a.it,.it.click{cursor:pointer}
.it .t{flex:1;min-width:0}
.it .t b{font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .t small{display:block;color:var(--muted);font-size:12.5px}
.it .ico{color:var(--brand);flex:none}
.it .chev{color:var(--muted);opacity:.6;flex:none}
.tag{font-size:10.5px;font-weight:800;border-radius:6px;padding:3px 7px;white-space:nowrap;flex:none}
.ok{background:var(--ok-bg);color:var(--ok)}.rd{background:var(--rd-bg);color:var(--rd)}.am{background:var(--am-bg);color:var(--am)}.bl{background:var(--bl-bg);color:var(--bl)}.gr{background:var(--gr-bg);color:var(--gr)}
.b{display:block;text-align:center;text-decoration:none;cursor:pointer;border-radius:12px;padding:12px;font-weight:800;border:1px solid var(--line);background:var(--surface);color:var(--brand);font-size:14px;width:100%;margin-top:8px}
.b.n{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.b.g{background:var(--wa);color:#fff;border-color:var(--wa)}
.b.sm{display:inline-block;width:auto;margin:0;padding:7px 12px;font-size:12.5px;border-radius:10px;flex:none}
.chain{display:flex;gap:4px;flex-wrap:wrap}
.chain a,.chain span{font-size:11.5px;font-weight:800;border-radius:7px;padding:4px 8px;text-decoration:none}
.kv{display:grid;grid-template-columns:110px 1fr;gap:7px 8px;font-size:13.5px;margin:12px 0 4px}
.kv dt{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.kv dd{margin:0;font-weight:700;min-width:0;overflow-wrap:anywhere}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.empty{color:var(--muted);font-size:13.5px;margin:12px 0}
.search{display:flex;align-items:center;gap:8px;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-bottom:10px;color:var(--muted)}
.search input{flex:1;border:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);padding:11px 0;outline:none;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{font-size:12.5px;border-radius:99px;padding:6px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--onaccent);font-weight:800}
.chip i{font-style:normal;opacity:.7;margin-left:3px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 12px;background:var(--surface)}
.seg a{text-align:center;text-decoration:none;font-weight:700;padding:10px;color:var(--muted)}
.seg a.on{background:var(--accent);color:var(--onaccent)}
.sets .it .ico{color:var(--muted)}

/* bottom nav (phones) */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav a{text-decoration:none;padding:9px 2px 11px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.nav a.on{color:var(--brand);font-weight:800}
@media (min-width:860px){
  .nav{display:none}
  .tabs{display:flex}
  .main{padding-bottom:40px}
  .topbar{padding-left:24px;padding-right:24px;border-bottom:1px solid var(--line);margin-bottom:12px}
}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 15px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;z-index:50}
.toast.show{opacity:1}
@media (min-width:640px){
  .two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;align-items:start}
}
</style>
</head>
<body>
<header class="topbar">
  <a class="lg" href="#home"><img class="lhq-logo" src="logo.png" alt="LHQ Learning Solutions"></a>
  <nav class="tabs" id="tabs"></nav>
  <div class="actions"><button class="ib theme-btn" type="button"></button></div>
</header>
<main class="main" id="main"></main>
<nav class="nav" id="nav" aria-label="Sections"></nav>
<div class="toast" id="toast" role="status"></div>

<script>
/* ================= data ================= */
const $ = id => document.getElementById(id);
const store = { get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } } };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/,/g,'')); return isNaN(n) ? 0 : n; };
const mk = n => 'MKW ' + Math.round(n).toLocaleString('en-US');
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WDAYL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const isoOf = dt => dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
const parseISO = iso => { const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); };
const today = () => isoOf(new Date());
const addDays = (iso, n) => { const d = parseISO(iso); d.setDate(d.getDate() + n); return isoOf(d); };
const dayDiff = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const nice = iso => { if(!iso) return ''; const d = parseISO(iso); return `${d.getDate()} ${MON[d.getMonth()]}${d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''}`; };
function range(a, b){ if(!a) return ''; if(!b) return nice(a) + ' onwards'; return `${nice(a)} – ${nice(b)}`; }
function ago(t){
  if(!t) return ''; const m = Math.round((Date.now() - t) / 60000);
  if(m < 1) return 'just now'; if(m < 60) return `${m} min ago`; const h = Math.round(m / 60); if(h < 24) return `${h} h ago`;
  const d = Math.round(h / 24); return d === 1 ? 'yesterday' : d < 30 ? `${d} days ago` : nice(isoOf(new Date(t)));
}
const first = s => String(s || '').trim().split(/\s+/)[0];
const WORD = {quote:'Quote', invoice:'Invoice', receipt:'Receipt', card:'Tuition card'};
const TAGC = {quote:'bl', invoice:'am', receipt:'ok', card:'gr'};
const sk = v => String(v || '').trim().toLowerCase().replace(/\s+/g, ' ');
const same = (a, b) => a && b && String(a).trim().toUpperCase() === String(b).trim().toUpperCase();

let saved = [], settings = {};
function load(){ saved = store.get('lhq_saved', []); settings = store.get('lhq_settings', {}); }
const grace = () => Math.max(0, Math.round(num(settings.graceDays ?? 3)));

/* the same sums as the editor (editor.html: totals, planInfo, invoiceFlag) */
function totals(d){
  const subtotal = (d.items||[]).reduce((s,it)=>s + num(it.sessions)*num(it.cost), 0);
  let discount = d.discType==='amt' ? num(d.discValue) : subtotal * num(d.discValue) / 100;
  discount = Math.round(Math.min(Math.max(discount, 0), subtotal) * 100) / 100;
  return {total: subtotal - discount};
}
/* where an invoice stands, counting its receipts too */
function invState(inv, receipts){
  const total = totals(inv).total;
  const fromRcts = receipts.reduce((m, r) => Math.max(m, num(r.prevPaid) + num(r.received)), 0);
  const paid = Math.max(num(inv.paid), fromRcts), balance = Math.round((total - paid) * 100) / 100, t = today();
  const st = {total, paid, balance, text:'', cls:'', over:false, grace:false, paidUp: total > 0 && balance <= 0.005};
  if(st.paidUp){ st.text = 'Paid'; st.cls = 'ok'; return st; }
  if(inv.plan === 'half'){
    const a1 = Math.round(total * 50) / 100;
    const start = inv.periodStart || inv.date || t, d1 = inv.plan1 || start;
    let mid = addDays(d1, 14);
    if(inv.periodStart && inv.periodEnd){ const days = dayDiff(inv.periodStart, inv.periodEnd) + 1, w = Math.round(days / 7); mid = w >= 2 ? addDays(inv.periodStart, Math.floor(w / 2) * 7) : addDays(inv.periodStart, Math.floor(days / 2)); }
    const d2 = inv.plan2 || mid;
    const next = paid < a1 - 0.005 ? {n:1, short:'1st instalment', due:d1, left:a1 - paid} : {n:2, short:'2nd instalment', due:d2, left:total - Math.max(paid, a1)};
    st.next = next; st.plan = true; st.firstPaid = paid >= a1 - 0.005;
    const end = addDays(next.due, grace());
    if(t > end){ st.over = true; st.text = `${next.short} overdue`; st.cls = 'rd'; }
    else if(t > next.due){ st.grace = true; st.text = `${next.short} in grace until ${nice(end)}`; st.cls = 'am'; }
    else { st.text = `${next.short} due ${nice(next.due)}`; st.cls = 'bl'; }
    return st;
  }
  if(inv.dueDate && t > inv.dueDate){ st.over = true; st.text = paid > 0 ? 'Balance overdue' : 'Overdue'; st.cls = 'rd'; }
  else { st.text = paid > 0 ? `Balance ${mk(balance)}` : 'Not paid yet'; st.cls = 'bl'; }
  return st;
}
const byDate = (a, b) => (b.date||'').localeCompare(a.date||'') || (b.savedAt||0) - (a.savedAt||0);

/* every document grouped by student, with where each one stands */
function students(){
  const map = new Map();
  saved.forEach(d => {
    const key = sk(d.student || d.name); if(!key) return;
    if(!map.has(key)) map.set(key, {key, docs:[]});
    map.get(key).docs.push(d);
  });
  return [...map.values()].map(s => {
    s.docs.sort(byDate);
    const D = s.docs, L = D[0];
    s.name = (D.find(d => d.student) || L).student || L.name;
    s.parent = (D.find(d => d.name && d.name !== s.name) || {}).name || '';
    s.level = (D.find(d => d.level) || {}).level || '';
    s.phone = (D.find(d => d.phone) || {}).phone || '';
    s.email = (D.find(d => d.email) || {}).email || '';
    s.school = (D.find(d => d.type === 'card' && d.school) || {}).school || '';
    s.last = Math.max(...D.map(d => d.savedAt || 0));
    const invs = D.filter(d => d.type === 'invoice');
    s.periods = invs.map(inv => {
      const receipts = D.filter(r => r.type === 'receipt' && same(r.ref, inv.number));
      const card = D.find(c => c.type === 'card' && (same(c.ref, inv.number) || receipts.some(r => same(c.ref, r.number))));
      const quote = D.find(q => (q.type || 'quote') === 'quote' && same(q.number, inv.ref));
      return {inv, receipts, card, quote, st: invState(inv, receipts)};
    });
    s.cur = s.periods[0] || null;
    const quotes = D.filter(d => (d.type || 'quote') === 'quote' && !invs.some(i => same(i.ref, d.number)));
    s.openQuote = quotes.find(q => !s.cur || (q.date || '') >= (s.cur.inv.date || '')) || null;
    if(!s.cur) s.loneCard = D.find(d => d.type === 'card' && !D.some(r => r.type === 'receipt' && same(d.ref, r.number))) || null;
    s.lastCard = D.find(d => d.type === 'card') || null;
    s.status = status(s);
    return s;
  }).sort((a, b) => a.name.localeCompare(b.name));
}
function status(s){
  const t = today(), c = s.cur;
  if(c){
    const end = c.inv.periodEnd;
    if(c.st.over) return {k:'over', text:'Overdue', cls:'rd'};
    if(end && end < t) return s.openQuote ? {k:'quote', text:'Quote sent', cls:'bl'} : {k:'ended', text:'Ended', cls:'gr'};
    if(end && dayDiff(t, end) <= 7) return {k:'ending', text:'Ends soon', cls:'am'};
    if(c.card) return {k:'active', text:'Active', cls:'ok'};
    return {k:'progress', text:'In progress', cls:'bl'};
  }
  if(s.openQuote) return {k:'quote', text:'Quote sent', cls:'bl'};
  if(s.loneCard) return {k:'active', text:'Card only', cls:'gr'};
  return {k:'other', text:'', cls:''};
}
function attention(list){
  const out = [], t = today();
  list.forEach(s => {
    const c = s.cur;
    if(c){
      const end = c.inv.periodEnd;
      if(c.st.over) out.push({w:0, s, ico:'alert', col:'--rd', title:s.name, sub:`${c.inv.number} · ${c.st.text}`, tag:['Overdue','rd']});
      else if(c.st.grace) out.push({w:1, s, ico:'clock', col:'--am', title:s.name, sub:`${c.inv.number} · ${c.st.text}`, tag:['Grace','am']});
      const paidEnough = c.st.paidUp || c.st.firstPaid;
      if(paidEnough && !c.card && !(end && end < t)) out.push({w:2, s, ico:'card', col:'--am', title:s.name, sub:`${c.inv.number} paid · no tuition card yet`, btn:['Make card', cardLink(s)]});
      if(c.card && end && end >= t && dayDiff(t, end) <= 7 && !s.openQuote) out.push({w:3, s, ico:'clock', col:'--am', title:s.name, sub:`Tuition period ends ${nice(end)}`, btn:['Renew', renewLink(s)]});
    }
    const q = s.openQuote;
    if(q && q.date && dayDiff(q.date, t) >= 7) out.push({w:4, s, ico:'quote', col:'--muted', title:s.name, sub:`${q.number} sent ${dayDiff(q.date, t)} days ago · no invoice yet`, btn:['Invoice', ed('conv=invoice:' + q.id)]});
  });
  return out.sort((a, b) => a.w - b.w);
}

/* links into the document editor */
const ed = h => 'editor.html#' + h;
const openLink = d => ed('open=' + d.id);
function cardLink(s){ const c = s.cur; return ed('conv=card:' + (c.receipts[0] || c.inv).id + (s.lastCard ? '&from=' + s.lastCard.id : '')); }
const renewLink = s => ed('renew=' + s.cur.inv.id);

/* ================= icons ================= */
const ICP = {quote:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>', inv:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>', rct:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>', card:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10h6M7 14h10"/>',
  home:'<path d="M4 11l8-7 8 7v9H4z"/>', users:'<circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.5 3-6 6-6s6 2.5 6 6"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14c2 .8 3 3 3 6"/>', rep:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>', set:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  docs:'<path d="M8 3h8l4 4v12H8z"/><path d="M16 3v4h4"/><path d="M4 7v14h12"/>', alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>', clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', chev:'<path d="M9 6l6 6-6 6"/>', back:'<path d="M15 6l-6 6 6 6"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>', search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>', edit:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/>', key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3"/>', out:'<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/>', list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>'};
const ic = (n, s = 20, w = 1.8) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICP[n] || ''}</svg>`;
const docIc = {quote:'quote', invoice:'inv', receipt:'rct', card:'card'};

/* ================= pages ================= */
function me(){ const s = window.hub && hub.session(); return s && s.me || {}; }
function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2800); }
window.hubToast = toast;

const P = {};
let route = {page:'home', arg:''};
function parseRoute(){
  const h = decodeURIComponent(location.hash.slice(1));
  const [page, ...rest] = h.split('/');
  route = {page: P[page] ? page : 'home', arg: rest.join('/')};
}
function render(){
  load(); parseRoute();
  const main = $('main');
  main.innerHTML = P[route.page](route.arg) || '';
  const sec = {student:'students', pick:'home'}[route.page] || route.page;
  const items = [['home','home','Home'],['students','users','Students'],['docs','docs','Documents'],['reports','rep','Reports'],['settings','set','Settings']];
  const href = k => k === 'reports' ? 'reports.html' : '#' + k;
  $('nav').innerHTML = items.map(([k, i, l]) => `<a href="${href(k)}" class="${sec === k ? 'on' : ''}">${ic(i, 21)}${l}</a>`).join('');
  $('tabs').innerHTML = items.map(([k, , l]) => `<a href="${href(k)}" class="${sec === k ? 'on' : ''}">${l}</a>`).join('');
  bind();
}
/* the editor's back button returns to the page you came from */
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="editor.html"],a[href="reports.html"]');
  if(a){ try{ sessionStorage.setItem('lhq_from', location.hash); }catch(err){} }
});

function docRow(d, opts = {}){
  const type = d.type || 'quote';
  const amount = type === 'card' ? (d.subjects || []).map(x => x.name).filter(Boolean).join(', ') || 'Tuition card'
    : type === 'receipt' ? 'Received ' + mk(num(d.received)) : mk(d.total != null ? d.total : totals(d).total);
  const who = d.updatedBy || d.createdBy;
  return `<a class="it" href="${openLink(d)}"><span class="ico">${ic(docIc[type])}</span><div class="t"><b>${esc(d.number || WORD[type])}${opts.noName ? '' : ' · ' + esc(d.student || d.name || '(no name)')}</b><small>${esc(nice(d.date))} · ${esc(amount)}${opts.showWho && who ? ' · by ' + esc(first(who)) : ''}${opts.showWho && d.savedAt ? ' · ' + ago(d.savedAt) : ''}</small></div><span class="chev">${ic('chev', 16, 2)}</span></a>`;
}

P.home = () => {
  const list = students(), att = attention(list), u = me();
  const h = new Date().getHours(), greet = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  const d = new Date();
  const draft = store.get('lhq_draft', null);
  const draftRow = draft && !draft.id && (draft.student || draft.name)
    ? `<div class="pn"><a class="it" href="editor.html"><span class="ico">${ic('edit')}</span><div class="t"><b>Unsaved ${esc(WORD[draft.type || 'quote'].toLowerCase())} · ${esc(draft.student || draft.name)}</b><small>Not saved yet. Open it to finish and save.</small></div><span class="tag am">Draft</span></a></div>` : '';
  const recent = saved.slice().sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0)).slice(0, 6);
  return `
  <div class="hi"><h1>${greet}${u.name ? ', ' + esc(first(u.name)) : ''}</h1><p>${WDAYL[d.getDay()]} ${d.getDate()} ${MONTHL[d.getMonth()]}</p></div>
  <div class="qk"><a href="${ed('new=quote')}">${ic('quote')}Quote</a><a href="#pick/invoice">${ic('inv')}Invoice</a><a href="#pick/receipt">${ic('rct')}Receipt</a><a href="#pick/card">${ic('card')}Card</a></div>
  ${draftRow}
  <div class="h2">Needs attention <em>${att.length || ''}</em></div>
  <div class="pn">${att.slice(0, 12).map(x => `<div class="it click" data-go="#student/${encodeURIComponent(x.s.key)}"><span class="ico" style="color:var(${x.col})">${ic(x.ico)}</span><div class="t"><b>${esc(x.title)}</b><small>${esc(x.sub)}</small></div>${x.tag ? `<span class="tag ${x.tag[1]}">${x.tag[0]}</span>` : `<a class="b sm" href="${x.btn[1]}">${x.btn[0]}</a>`}</div>`).join('') || '<p class="empty">Nothing needs attention. Overdue payments, paid invoices without a card, and periods ending this week show here.</p>'}</div>
  <div class="h2">Recent</div>
  <div class="pn">${recent.map(d => docRow(d, {showWho:true})).join('') || '<p class="empty">Nothing saved yet. Start with a quote.</p>'}</div>`;
};

let sQuery = '', sFilter = 'all';
P.students = () => {
  const list = students();
  const F = S_FILTERS;
  return `
  <div class="hi"><h1>Students</h1><p>${list.length} student${list.length === 1 ? '' : 's'} in LHQ Hub</p></div>
  <label class="search">${ic('search', 18)}<input id="sq" type="search" placeholder="Search name, parent or number" value="${esc(sQuery)}" autocomplete="off"></label>
  <div class="chips">${Object.entries(F).map(([k, [l, f]]) => `<button class="chip ${sFilter === k ? 'on' : ''}" data-filter="${k}">${l}<i>${list.filter(f).length}</i></button>`).join('')}</div>
  <div class="pn" id="slist">${studentRows(list)}</div>`;
};
const S_FILTERS = {all:['All', () => true], active:['Active', s => s.status.k === 'active' || s.status.k === 'progress'], over:['Overdue', s => s.status.k === 'over'], ending:['Ends soon', s => s.status.k === 'ending'], ended:['Ended', s => s.status.k === 'ended']};
function studentRows(list){
  const q = sk(sQuery);
  const rows = list.filter(S_FILTERS[sFilter][1]).filter(s => !q || sk(s.name + ' ' + s.parent + ' ' + s.level + ' ' + s.docs.map(d => d.number).join(' ')).includes(q));
  return rows.map(s => `<a class="it" href="#student/${encodeURIComponent(s.key)}"><div class="t"><b>${esc(s.name)}</b><small>${esc([s.level, s.cur ? range(s.cur.inv.periodStart, s.cur.inv.periodEnd) : '', subjectsOf(s)].filter(Boolean).join(' · '))}</small></div>${s.status.text ? `<span class="tag ${s.status.cls}">${s.status.text}</span>` : ''}</a>`).join('') || `<p class="empty">${list.length ? 'No students match.' : 'No students yet. They appear here as soon as a quote, invoice, receipt or card is saved.'}</p>`;
}
function subjectsOf(s){
  const d = s.cur ? s.cur.card || s.cur.inv : s.openQuote || s.loneCard;
  if(!d) return '';
  return d.type === 'card' ? (d.subjects || []).map(x => x.name).filter(Boolean).join(', ') : (d.items || []).map(x => x.desc).filter(Boolean).join(', ');
}

P.student = key => {
  const s = students().find(x => x.key === key);
  if(!s) return `<a class="crumb" href="#students">${ic('back', 16, 2.2)} Students</a><p class="empty">That student isn't here. They may have been renamed or deleted.</p>`;
  const c = s.cur;
  const step = (d, label, extra) => d ? `<a class="ok" href="${openLink(d)}">✓ ${esc(d.number)}${extra || ''}</a>` : `<span class="gr">${label}</span>`;
  let chain = '', facts = '', next = '';
  if(c){
    chain = (c.quote || c.inv.ref ? step(c.quote, 'Quote') : '') + step(c.inv, 'Invoice') + (c.receipts.length ? c.receipts.slice().reverse().map(r => step(r, 'Receipt')).join('') : step(null, 'Receipt')) + step(c.card, 'Card');
    facts = `<dt>Invoice</dt><dd>${mk(c.st.total)}${c.inv.plan === 'half' ? ' · 50/50 plan' : ''}</dd>
      <dt>Paid</dt><dd>${mk(c.st.paid)} <span class="tag ${c.st.cls}">${esc(c.st.text)}</span></dd>
      ${c.card ? `<dt>Tutors</dt><dd>${(c.card.subjects || []).map(x => `${esc(x.name)}${x.tutor ? ': ' + esc(x.tutor) : ': no tutor yet'}`).join('<br>')}</dd>` : ''}`;
    if(!c.st.paidUp) next += `<a class="b g" href="${ed('conv=receipt:' + c.inv.id)}">${c.st.plan && c.st.firstPaid ? 'Receive 2nd instalment' : 'Record a payment'}</a>`;
    if(!c.card) next += `<a class="b ${c.st.paidUp || c.st.firstPaid ? 'n' : ''}" href="${cardLink(s)}">Make tuition card${s.lastCard ? ' (same subjects and tutors as last time)' : ''}</a>`;
    const endSoon = !c.inv.periodEnd || dayDiff(today(), c.inv.periodEnd) <= 14;
    if(c.card && !s.openQuote && endSoon) next += `<a class="b ${c.st.paidUp && !c.st.over ? 'n' : ''}" href="${renewLink(s)}">Renew for the next period</a><p class="note">Renew makes the next invoice with the same subjects, starting after ${esc(nice(c.inv.periodEnd) || 'this period')}. Then make the card from it: the subjects, days and tutors carry over.</p>`;
  } else if(s.loneCard){
    chain = step(null, 'Quote') + step(null, 'Invoice') + step(null, 'Receipt') + step(s.loneCard, 'Card');
  }
  if(s.openQuote){
    next = `<a class="b n" href="${ed('conv=invoice:' + s.openQuote.id)}">Parent agreed → Make invoice from ${esc(s.openQuote.number)}</a>` + next;
    if(!c) chain = step(s.openQuote, 'Quote') + step(null, 'Invoice') + step(null, 'Receipt') + step(null, 'Card');
  }
  if(!next) next = `<a class="b n" href="${ed('new=quote&student=' + encodeURIComponent(s.name))}">New quote for ${esc(first(s.name))}</a>`;
  else next += `<a class="b" href="${ed('new=quote&student=' + encodeURIComponent(s.name))}">New quote</a>`;
  const earlier = s.periods.slice(1);
  const period = c ? range(c.inv.periodStart, c.inv.periodEnd) || c.inv.period || '' : '';
  return `
  <a class="crumb" href="#students">${ic('back', 16, 2.2)} Students</a>
  <div class="hi"><h1>${esc(s.name)}</h1><p>${esc([s.level, s.school].filter(Boolean).join(' · ') || ' ')}</p></div>
  <div class="two"><div>
  <div class="pn pad"><div class="h2" style="margin-top:0">${c ? 'This tuition period' + (period ? ' · ' + esc(period) : '') : s.openQuote ? 'New enrolment' : 'Documents'}</div>
    ${chain ? `<div class="chain">${chain}</div>` : ''}
    <dl class="kv">${facts}
      ${s.parent ? `<dt>Parent</dt><dd>${esc(s.parent)}</dd>` : ''}
      ${s.phone ? `<dt>WhatsApp</dt><dd><a href="https://wa.me/${esc(waNum(s.phone))}" target="_blank" rel="noopener">${esc(s.phone)}</a></dd>` : ''}
      ${s.email ? `<dt>Email</dt><dd><a href="mailto:${esc(s.email)}">${esc(s.email)}</a></dd>` : ''}
    </dl></div>
  <div class="pn pad"><div class="h2" style="margin-top:0">Next step</div>${next}</div>
  </div><div>
  ${earlier.length ? `<div class="h2">Earlier periods</div><div class="pn">${earlier.map(p => `<a class="it" href="${openLink(p.inv)}"><div class="t"><b>${esc(range(p.inv.periodStart, p.inv.periodEnd) || nice(p.inv.date))}</b><small>${esc(p.inv.number)}${p.card ? ' · ' + esc(p.card.number) : ''} · ${mk(p.st.total)}</small></div><span class="tag ${p.st.cls}">${esc(p.st.paidUp ? 'Paid' : p.st.text)}</span></a>`).join('')}</div>` : ''}
  <div class="h2">All documents <em>${s.docs.length}</em></div>
  <div class="pn">${s.docs.map(d => docRow(d, {noName:true, showWho:true})).join('')}</div>
  </div></div>`;
};
function waNum(raw){ let n = String(raw || '').replace(/\D/g, ''); if(n.startsWith('0')) n = '265' + n.slice(1); else if(n.length === 9) n = '265' + n; return n; }

let dQuery = '', dType = 'all';
P.docs = () => {
  const all = saved.slice().sort(byDate);
  const T = {all:'All', quote:'Quotes', invoice:'Invoices', receipt:'Receipts', card:'Cards'};
  return `
  <div class="hi"><h1>Documents</h1><p>${all.length} saved in LHQ Hub</p></div>
  <label class="search">${ic('search', 18)}<input id="dq" type="search" placeholder="Search number or name" value="${esc(dQuery)}" autocomplete="off"></label>
  <div class="chips">${Object.entries(T).map(([k, l]) => `<button class="chip ${dType === k ? 'on' : ''}" data-dtype="${k}">${l}<i>${k === 'all' ? all.length : all.filter(d => (d.type || 'quote') === k).length}</i></button>`).join('')}</div>
  <div class="pn" id="dlist">${docRows()}</div>
  <p class="note">To delete a document or make one from another, use the <a href="editor.html">full list in the editor</a>.</p>`;
};

function docRows(){
  const q = sk(dQuery);
  const rows = saved.slice().sort(byDate).filter(d => dType === 'all' || (d.type || 'quote') === dType).filter(d => !q || sk([d.number, d.student, d.name, d.level].join(' ')).includes(q));
  return rows.slice(0, 300).map(d => docRow(d, {showWho:true})).join('') || '<p class="empty">Nothing here.</p>';
}
P.pick = type => {
  const list = students();
  const T = {invoice:'Invoice', receipt:'Receipt', card:'Tuition card'}[type];
  if(!T) return P.home();
  let rows = [], blank = `<a class="b" href="${ed('new=' + type)}">Start a blank ${T.toLowerCase()}</a>`, intro = '';
  if(type === 'invoice'){
    intro = 'Pick the quote the parent agreed to, or start a blank invoice.';
    rows = list.filter(s => s.openQuote).map(s => ({href: ed('conv=invoice:' + s.openQuote.id), t:s.name, sub:`${s.openQuote.number} · ${nice(s.openQuote.date)} · ${mk(totals(s.openQuote).total)}`}));
  } else if(type === 'receipt'){
    intro = 'Pick the invoice this payment is for.';
    list.forEach(s => s.periods.forEach(p => { if(!p.st.paidUp) rows.push({href: ed('conv=receipt:' + p.inv.id), t:s.name, sub:`${p.inv.number} · ${p.st.text} · balance ${mk(p.st.balance)}`, over:p.st.over}); }));
    rows.sort((a, b) => (b.over ? 1 : 0) - (a.over ? 1 : 0));
  } else {
    intro = 'Pick the invoice the card is for.';
    list.forEach(s => { const c = s.cur; if(c && !c.card) rows.push({href: cardLink(s), t:s.name, sub:`${c.inv.number} · ${c.st.text}${s.lastCard ? ' · subjects and tutors from ' + s.lastCard.number : ''}`}); });
  }
  return `<a class="crumb" href="#home">${ic('back', 16, 2.2)} Home</a>
  <div class="hi"><h1>New ${T.toLowerCase()}</h1><p>${intro}</p></div>
  <div class="pn">${rows.map(r => `<a class="it" href="${r.href}"><div class="t"><b>${esc(r.t)}</b><small>${esc(r.sub)}</small></div><span class="chev">${ic('chev', 16, 2)}</span></a>`).join('') || '<p class="empty">Nothing waiting.</p>'}</div>
  ${blank}`;
};

P.settings = () => {
  const u = me();
  const row = (href, icon, t, sub, id) => `<a class="it" ${id ? `id="${id}" href="#settings"` : `href="${href}"`}><span class="ico">${ic(icon)}</span><div class="t"><b>${t}</b>${sub ? `<small>${sub}</small>` : ''}</div><span class="chev">${ic('chev', 16, 2)}</span></a>`;
  return `
  <div class="hi"><h1>Settings</h1><p>${esc(u.name || '')}${u.name ? ' · ' : ''}${[u.admin ? 'Admin' : '', u.tutor ? 'Tutor' : ''].filter(Boolean).join(' + ')}</p></div>
  <div class="sets">
  <div class="h2">People</div>
  <div class="pn">${u.admin ? row('', 'users', 'People &amp; access', 'Add people, reset PINs, switch someone off', 'sPeople') : ''}${row('', 'key', 'Change my PIN', '', 'sPin')}</div>
  <div class="h2">Documents</div>
  <div class="pn">
    ${row(ed('settings=tplSetup'), 'edit', 'Email &amp; WhatsApp messages', 'The wording sent with quotes, invoices and receipts')}
    ${row(ed('settings=listSetup'), 'list', 'Lists', 'Subjects, levels, payment methods, tutors, grades')}
    ${row(ed('settings=numSetup'), 'inv', 'Numbering', 'Where each series continues from')}
    ${row(ed('settings=coSetup'), 'set', 'Company &amp; bank details', 'Bank, phone numbers, rates, due dates, grace period')}
    ${row(ed('settings=clSetup'), 'quote', 'Student topic checklist link', 'Send it to new students')}
    ${row(ed('settings=emailSetup'), 'rep', 'Sending (email &amp; WhatsApp)', 'Access code for this device')}
    ${row(ed('settings=backupSetup'), 'docs', 'Backup &amp; restore', 'An extra copy as a file')}
  </div>
  <div class="h2">Other</div>
  <div class="pn">
    ${row('editor.html', 'docs', 'Classic view', 'The editor with the full saved list, as before LHQ Hub')}
    ${row('reports.html', 'rep', 'Tutor reports', 'Session logs and weekly reports for parents')}
    ${row('', 'out', '<span style="color:var(--rd)">Sign out</span>', 'Removes LHQ\'s documents from this device', 'sOut')}
  </div></div>`;
};

function bind(){
  const sq = $('sq'); if(sq) sq.oninput = () => { sQuery = sq.value; $('slist').innerHTML = studentRows(students()); };
  const dq = $('dq'); if(dq) dq.oninput = () => { dQuery = dq.value; $('dlist').innerHTML = docRows(); };
  document.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => { sFilter = b.dataset.filter; render(); });
  document.querySelectorAll('[data-dtype]').forEach(b => b.onclick = () => { dType = b.dataset.dtype; render(); });
  document.querySelectorAll('[data-go]').forEach(el => el.onclick = e => { if(e.target.closest('a')) return; location.hash = el.dataset.go; });
  const H = window.hub || {};
  if($('sPeople')) $('sPeople').onclick = e => { e.preventDefault(); H.peopleDlg && H.peopleDlg(); };
  if($('sPin')) $('sPin').onclick = e => { e.preventDefault(); H.myPinDlg && H.myPinDlg(); };
  if($('sOut')) $('sOut').onclick = e => { e.preventDefault(); H.signOut && H.signOut(); };
}

window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
window.hubApply = render;     // documents changed on another device
window.hubReady = render;     // signed in
window.hubRemap = render;
window.addEventListener('pageshow', e => { if(e.persisted) render(); });
render();
</script>
</body>
</html>
