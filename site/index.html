<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LHQ Hub</title>
<link rel="icon" href="arrow.png">
<link rel="apple-touch-icon" href="logo.png">
<script>
/* links made before LHQ Hub (student checklists) open the document page */
if(/^#import=/.test(location.hash)) location.replace('doc.html' + location.hash);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hub.css">
<script src="theme.js"></script>
<script src="sync.js"></script>
<script src="defaults.js"></script>
<script src="hubdata.js"></script>
<script src="nav.js"></script>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100dvh}
svg{display:block;flex:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
[hidden]{display:none!important}
.main{width:100%;max-width:1040px;margin:0 auto;padding:0 24px 60px}
.main.narrow{max-width:800px}
@media (max-width:699px){.main{padding:0 16px 40px}}

.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:4px 0 18px}
.ph .tt{flex:1;min-width:200px}
.ph h1{margin:0;font-size:25px;font-weight:800;letter-spacing:-.3px;color:var(--brand);text-wrap:balance}
.ph p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.crumb{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--muted);font-weight:700;font-size:13.5px;padding:4px 0;margin:0 0 4px;text-decoration:none}
.crumb:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--brand);border-radius:11px;padding:9px 14px;font-weight:800;font-size:13.5px;min-height:40px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.n{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.btn.g{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.rd{color:var(--rd)}
.btn.full{width:100%;margin-top:8px}
.btn.sm{min-height:32px;padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 16px;margin-bottom:16px}
.card.pad{padding:16px}
.h2{font-size:13px;font-weight:800;margin:6px 2px 8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.h2 em{font-style:normal;color:var(--muted);font-weight:700}
.cap{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:12px 0 6px;font-weight:800}
.card.pad > .cap:first-child{margin-top:0}
.it{display:flex;gap:12px;align-items:center;padding:12px 0;border:0;border-top:1px solid var(--line2);width:100%;background:none;text-align:left;text-decoration:none;color:inherit}
.it:first-child,.cap+.it{border-top:0}
a.it,button.it{cursor:pointer}
a.it:hover .t b,button.it:hover .t b{text-decoration:underline;text-underline-offset:2px}
.it .t{flex:1;min-width:0}.it .t b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it .t small{display:block;color:var(--muted);font-size:12.5px}
.it .ico{color:var(--brand);flex:none}.it .chev{color:var(--muted);opacity:.6}
.tag{font-size:10.5px;font-weight:800;border-radius:6px;padding:3px 7px;white-space:nowrap;flex:none}
.ok{background:var(--ok-bg);color:var(--ok)}.rd{background:var(--rd-bg);color:var(--rd)}.am{background:var(--am-bg);color:var(--am)}.bl{background:var(--bl-bg);color:var(--bl)}.gr{background:var(--gr-bg);color:var(--gr)}
.av{width:32px;height:32px;border-radius:50%;background:var(--bl-bg);color:var(--bl);display:grid;place-items:center;font-weight:800;font-size:12.5px;flex:none}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 10px;font-size:13.5px;margin:4px 0}
.kv dt{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}.kv dd{margin:0;font-weight:700;min-width:0;overflow-wrap:anywhere}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.empty{color:var(--muted);font-size:13.5px;margin:12px 0}
.search{display:flex;align-items:center;gap:8px;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--muted);margin-bottom:12px}
.search input{flex:1;border:0;background:transparent;font-size:15px;color:var(--ink);padding:11px 0;outline:none;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:12.5px;border-radius:99px;padding:6px 12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--onaccent);font-weight:800}
.chip i{font-style:normal;opacity:.65;margin-left:4px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto}
.tabs a{text-decoration:none;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a.on{color:var(--brand);border-bottom-color:var(--gold)}
.chain{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:2px 0 10px}
.chain a,.chain span.s{font-size:11.5px;font-weight:800;border-radius:7px;padding:4px 8px;text-decoration:none}
.chain .ar{color:var(--muted);opacity:.6}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 18px;align-items:start}
@media (max-width:899px){.grid2{grid-template-columns:minmax(0,1fr)}}
/* forms */
label.f{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 12px}
label.f > span{display:block;margin-bottom:5px}
.in{width:100%;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;min-height:44px;color:var(--ink)}
textarea.in{min-height:200px;line-height:1.45;resize:vertical}
.in:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.r3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 10px}
@media (max-width:560px){.r2,.r3{grid-template-columns:1fr}}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface);margin-bottom:12px}
.seg button{border:0;background:none;font-weight:700;padding:9px 16px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--onaccent)}
.toggle{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line2)}
.cap + .toggle{border-top:0}
.toggle .t{flex:1}.toggle .t b{display:block;font-weight:700}.toggle .t small{color:var(--muted);font-size:12.5px;display:block}
.sw-t{width:44px;height:26px;border-radius:99px;background:var(--line);border:0;position:relative;flex:none;padding:0}
.sw-t::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw-t.on{background:var(--accent)}.sw-t.on::after{left:21px}
.sw-t:disabled{opacity:.5}
.lock{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line2);color:var(--muted);font-size:13.5px}
.lchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.lchips span{display:inline-flex;align-items:center;gap:2px;background:var(--bl-bg);color:var(--bl);border-radius:99px;padding:4px 4px 4px 11px;font-size:13px;font-weight:700}
.lchips span button{border:0;background:none;color:inherit;width:24px;height:24px;border-radius:50%;padding:0;opacity:.7}
.addrow{display:flex;gap:8px}.addrow .in{min-height:38px;padding:7px 11px;font-size:14px}
.vars{display:flex;flex-wrap:wrap;gap:5px;margin:-4px 0 12px}
.vars button{font-size:11.5px;font-family:ui-monospace,Menlo,monospace;border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:2px 6px}
.code{display:flex;gap:8px;align-items:center;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 12px;font-size:13px;overflow:hidden}
.code span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.svc{display:flex;align-items:center;gap:8px;font-size:13.5px;margin:4px 0 10px}
.svc i{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}.svc.ok i{background:#2fa36b}.svc.warn i{background:#d08a00}

/* home cards */
.mcs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:22px}
@media (min-width:1100px){.main.narrow .mcs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mc{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;position:relative;min-height:132px;color:var(--ink);text-decoration:none}
a.mc:hover{border-color:var(--muted)}
.mc .l{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.mc .l svg{color:var(--brand)}
.mc .v{font-size:27px;font-weight:800;color:var(--brand);letter-spacing:-.6px;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:4px}
.mc .v small{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:0}
.mc .s{font-size:12.5px;color:var(--muted)}
.mc .s.warn{color:var(--am);font-weight:700}.mc .s.bad{color:var(--rd);font-weight:700}
.mc .tr{font-size:11.5px;font-weight:800;margin-top:auto;padding-top:4px}.mc .tr.up{color:var(--ok)}.mc .tr.dn{color:var(--rd)}.mc .tr.fl{color:var(--muted)}
.mc .bar{height:6px;border-radius:99px;background:var(--gr-bg);overflow:hidden;margin:6px 0 3px}.mc .bar i{display:block;height:100%;background:var(--gold)}
.mc.ed{border-style:dashed;padding-top:46px}
.mc .ctl{position:absolute;top:8px;right:8px;left:8px;display:flex;gap:4px}
.mc .ctl button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:0;display:grid;place-items:center;color:var(--ink)}
.mc .ctl button.rm{color:var(--rd);margin-left:auto}
.mc .ctl button:disabled{opacity:.3}
@media (max-width:699px){.mc{padding:12px 13px;min-height:0}.mc .v{font-size:21px}.mc .v small{font-size:12px}.mcs{gap:10px}}

/* settings */
.sw{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;align-items:start}
.snav{position:sticky;top:76px}
.snav .g{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin:14px 12px 4px}
.snav .g:first-child{margin-top:0}
.snav a{display:flex;align-items:center;gap:10px;width:100%;border-radius:9px;padding:8px 12px;font-weight:700;color:var(--ink);text-decoration:none}
.snav a svg{color:var(--muted)}
.snav a:hover{background:var(--hover)}
.snav a.on{background:var(--surface);box-shadow:0 0 0 1px var(--line);color:var(--brand)}
.snav a.on svg{color:var(--brand)}
.sw .crumb{display:none}
@media (max-width:899px){
  .sw{display:block}
  .sw.page .snav{display:none}
  .sw.index .spage{display:none}
  .snav{position:static;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 6px}
  .snav a{padding:12px}
  .snav a::after{content:"›";margin-left:auto;color:var(--muted);font-size:18px;line-height:1}
  .sw .crumb{display:inline-flex}
}
.sec-h{margin:0 0 4px;font-size:21px;font-weight:800;color:var(--brand)}
.sec-p{margin:0 0 18px;color:var(--muted);font-size:13.5px}
.rolechip{font-size:10.5px;font-weight:800;border-radius:6px;padding:3px 7px;background:var(--am-bg);color:var(--am)}

/* sheet + toast */
.shbg{position:fixed;inset:0;background:rgba(7,20,40,.42);z-index:40}
.sheet{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 40px);overflow:auto;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:18px 18px 20px}
.sheet h3{margin:0;font-size:18px;font-weight:800;flex:1}
.sheet .sp{margin:4px 0 14px;color:var(--muted);font-size:13.5px}
.sheet .hx{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.ib{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;flex:none;color:var(--ink)}
@media (max-width:699px){.sheet{left:0;right:0;bottom:0;top:auto;transform:none;width:auto;border-radius:20px 20px 0 0;max-height:86dvh;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tgrid a{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:14px;padding:14px;text-decoration:none;color:var(--ink)}
.tgrid a svg{color:var(--brand)}.tgrid a b{font-size:15px}.tgrid a small{color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:11px;font-size:13.5px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:92vw;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>
<script>LHQNav.mount('home');</script>
<main class="main" id="main"></main>
<div class="shbg" id="shbg" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="restoreFile" accept=".json,application/json,text/plain" hidden>

<script>
const $ = id => document.getElementById(id);
const {store, esc, num, mk, mkShort, nice, range, ago, first, sk, same, today, addDays, dayDiff, WORD, typeOf, can, isDir, me, roleText} = HD;
const ICP = {quote:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>', invoice:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>', receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>', card:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10h6M7 14h10"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.5 3-6 6-6s6 2.5 6 6"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14c2 .8 3 3 3 6"/>', alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>', clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', chev:'<path d="M9 6l6 6-6 6"/>', back:'<path d="M15 6l-6 6 6 6"/>', search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/>', plus:'<path d="M12 5v14M5 12h14"/>', user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>', key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3"/>', bank:'<path d="M3 10l9-6 9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/>', cash:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>', hash:'<path d="M9 4L7 20M17 4l-2 16M4 9h16M3 15h16"/>', msg:'<path d="M4 5h16v11H9l-5 4z"/>', list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>', link:'<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>', wa:'<path d="M4 20l1.3-4A8 8 0 1112 20a8 8 0 01-4-1z"/>', box:'<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>', bin:'<path d="M4 7h16M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/>', restore:'<path d="M4 12a8 8 0 108-8 8 8 0 00-6 2.7L4 9"/><path d="M4 4v5h5"/>', out:'<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/>', rep:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>', copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V4h12"/>', layout:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16h18"/>'};
const ic = (n, s = 20, w = 1.8) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICP[n]||''}</svg>`;
const inits = n => String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(x => x[0]).join('').toUpperCase();
function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3200); }
window.hubToast = toast;
function openSheet(html){ $('sheet').innerHTML = html; $('sheet').hidden = false; $('shbg').hidden = false; const f = $('sheet').querySelector('input'); if(f && innerWidth > 700) setTimeout(() => f.focus(), 50); }
function closeSheet(){ $('sheet').hidden = true; $('shbg').hidden = true; if(/^#new/.test(location.hash)) history.replaceState(null, '', '#home'); }
$('shbg').onclick = closeSheet;
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !$('sheet').hidden) closeSheet(); });

/* links into the document page */
const D = h => 'doc.html#' + h;
const openLink = d => D('d=' + d.id);
const stuLink = (key, tab) => '#student/' + encodeURIComponent(key) + (tab ? '/' + tab : '');

let saved = [];
function load(){ saved = HD.load(); }

/* ================= routes ================= */
const P = {};
let route = {page:'home', args:[]};
function parse(){
  const h = location.hash.slice(1), parts = h.split('/').map(decodeURIComponent);
  const page = parts[0] || 'home';
  route = {page: P[page] ? page : 'home', args: parts.slice(1)};
}
function render(){
  load(); parse();
  const sec = {student:'students', set:'settings', person:'settings', new:'home', edithome:'home'}[route.page] || route.page;
  LHQNav.section(sec);
  const m = $('main');
  m.className = 'main' + (['home','edithome','new','students','student'].includes(route.page) ? ' narrow' : '');
  m.innerHTML = P[route.page](...route.args) || '';
  bind();
  if(route.page === 'new') newSheet(route.args[0]);
}
window.addEventListener('hashchange', () => { render(); if(!/^#new/.test(location.hash)) window.scrollTo(0, 0); });
window.hubApply = render; window.hubReady = () => { render(); HD.refreshPeople().then(render); }; window.hubRemap = render; window.hubMe = render;
window.addEventListener('pageshow', e => { if(e.persisted) render(); });

function docRow(d, o = {}){
  const t = typeOf(d), [s, c] = HD.docStatus(d);
  const amt = t === 'card' ? (d.subjects||[]).map(x => x.name).filter(Boolean).join(', ') || 'Tuition card' : t === 'receipt' ? 'Received ' + mk(num(d.received)) : mk(d.total != null ? d.total : HD.total(d));
  const who = d.updatedBy || d.createdBy;
  const sub = o.sub || [nice(d.date), amt, who ? 'by ' + first(who) : '', d.savedAt && o.when ? ago(d.savedAt) : ''].filter(Boolean).join(' · ');
  return `<a class="it" href="${openLink(d)}"><span class="ico">${ic(t)}</span><span class="t"><b>${esc(d.number || WORD[t])}${o.noName ? '' : ' · ' + esc(d.student || d.name || '(no name)')}</b><small>${esc(sub)}</small></span><span class="tag ${c}">${esc(s)}</span></a>`;
}

/* ================= home ================= */
function attention(list){
  const out = [], t = today();
  list.forEach(s => {
    const c = s.cur;
    if(c){
      const end = c.inv.periodEnd;

    <label class="f"><span>How did they hear about LHQ?</span><select class="in" id="ns_heard"><option value="">Choose</option>${['A friend or family member','Sibling at LHQ','Instagram','Facebook','WhatsApp','Study Smart Session','Their school','Google','Other'].map(x => `<option>${x}</option>`).join('')}</select></label>
    <button class="btn n full" id="nsGo">${thenQuote ? 'Save and make a quote' : 'Save student'}</button>`);
  $('nsGo').onclick = () => {
    const name = $('ns_name').value.trim(); if(!name){ toast('Add the student\'s name'); $('ns_name').focus(); return; }
    if(HD.studentRecords()[sk(name)] || saved.some(d => sk(d.student) === sk(name))){ if(!confirm(`${name} is already a student. Use the existing one?`)) return; }
    const f = {}; HD.DETAIL.forEach(k => { const el = $('ns_' + k); if(el) f[k] = el.value; });
    const key = HD.saveStudent(sk(name), f);

  };
}

/* ================= new ================= */
function newSheet(type){
  const list = HD.students();
  const T = [['quote','Quote','For a new or returning student','quotes'],['invoice','Invoice','From a quote the parent agreed to','quotes'],['receipt','Receipt','For a payment on an invoice','receipts'],['card','Tuition card','For tutors, from an invoice','cards']].filter(x => can(x[3]));
  if(!type || !T.some(x => x[0] === type)){
    openSheet(`<div class="hx"><h3>New</h3><button class="ib" data-close>✕</button></div><p class="sp">What are you making?</p>
      <div class="tgrid">${T.map(([t, l, s]) => `<a href="#new/${t}">${ic(t, 22)}<b>${l}</b><small>${s}</small></a>`).join('')}</div>`);
    return;
  }
  let rows = '', q = '', blank = `<a class="btn full" href="${D('new=' + type)}">Start a blank ${type === 'card' ? 'tuition card' : WORD[type].toLowerCase()} instead</a>`;
  if(type === 'quote'){
    q = 'Which student?';
    rows = `<label class="search">${ic('search',18)}<input id="nsq" type="search" placeholder="Search students" autocomplete="off"></label><div id="nsl">${pickRows(list, '')}</div>`;
    blank = `<button class="btn full" id="nsNew">${ic('plus',16,2.2)} New student</button>`;
  } else if(type === 'invoice'){
    q = 'Which quote did the parent agree to?';
    rows = list.filter(s => s.openQuote).map(s => pickRow(D('conv=invoice:' + s.openQuote.id), s.name, `${s.openQuote.number} · ${nice(s.openQuote.date)} · ${mk(HD.total(s.openQuote))}`)).join('');
  } else if(type === 'receipt'){
    q = 'Which invoice is this payment for?';
    const r = []; list.forEach(s => s.periods.forEach(p => { if(!p.st.paidUp) r.push({over:p.st.over, h:pickRow(D('conv=receipt:' + p.inv.id), s.name, `${p.inv.number} · ${p.st.text} · balance ${mk(p.st.balance)}`, p.st.over ? ['Overdue','rd'] : null)}); }));
    rows = r.sort((a, b) => (b.over ? 1 : 0) - (a.over ? 1 : 0)).map(x => x.h).join('');
  } else {
    q = 'Which invoice is the card for?';
    rows = list.filter(s => s.cur && !s.cur.card).map(s => pickRow(cardLink(s), s.name, `${s.cur.inv.number} · ${s.cur.st.text}${s.lastCard ? ' · subjects and tutors from ' + s.lastCard.number : ''}`)).join('');
  }
  openSheet(`<div class="hx"><a class="ib" href="#new" aria-label="Back">${ic('back',16,2.2)}</a><h3>New ${type === 'card' ? 'tuition card' : WORD[type].toLowerCase()}</h3><button class="ib" data-close>✕</button></div><p class="sp">${q}</p>
    <div>${rows || '<p class="empty">Nothing waiting.</p>'}</div>${blank}`);
  if(type === 'quote'){
    $('nsq').oninput = e => { $('nsl').innerHTML = pickRows(list, e.target.value); };
    $('nsNew').onclick = () => newStudentSheet(true);
  }
}
const pickRow = (href, t, sub, tag) => `<a class="it" href="${href}"><span class="av">${inits(t)}</span><span class="t"><b>${esc(t)}</b><small>${esc(sub)}</small></span>${tag ? `<span class="tag ${tag[1]}">${tag[0]}</span>` : `<span class="chev">${ic('chev',16,2)}</span>`}</a>`;

  <div class="acts" style="margin-top:10px"><a class="btn g" href="https://wa.me/?text=${encodeURIComponent('Please choose your subjects and topics for LHQ tuition here: ' + link)}" target="_blank" rel="noopener">${ic('wa',16)} Send on WhatsApp</a><a class="btn" href="${esc(link)}" target="_blank" rel="noopener">Open checklist</a></div>
  <p class="note">Students send it to 0992 525 250 on WhatsApp or to learnhqes@gmail.com.</p></div>`; };

S.sending = () => `<h2 class="sec-h">Email & WhatsApp</h2><p class="sec-p">Sending documents straight from LHQ Hub.</p>
  <div class="card pad"><p class="svc" id="svcEmail"><i></i><span>Email: checking…</span></p><p class="svc" id="svcWa"><i></i><span>WhatsApp: checking…</span></p>
  <label class="f" style="margin-top:12px"><span>Access code for this device</span><input class="in" id="accessCode" type="password" autocomplete="off" value="${esc(store.get('lhq_code', ''))}" placeholder="The code set in Netlify"></label>
  <p class="note" style="margin:-6px 0 12px">Enter it once on each phone, tablet or computer. It stays on this device.</p>
  <button class="btn n" id="codeSave">Save and check</button></div>`;

S.backup = () => { const last = store.get('lhq_lastBackup', 0);
  return `<h2 class="sec-h">Backup & restore</h2><p class="sec-p">Everything is stored online in LHQ Hub. A backup is an extra copy as one file: keep it in Google Drive or send it to yourself.</p>
  <div class="card pad"><dl class="kv"><dt>Last backup</dt><dd>${last ? ago(last) : 'Never'}</dd><dt>Documents</dt><dd>${saved.length}</dd></dl>
  <div class="acts" style="margin-top:12px"><button class="btn n" id="bkGo">Back up now</button><button class="btn" id="rsGo">Add from a backup</button></div>
  <p class="note">Adding from a backup brings back documents that are missing, and the newer copy wins where a document is in both. It never deletes anything.</p></div>`; };

let trashList = null;
S.deleted = () => {
  if(trashList === null){ hub.api('trash').then(r => { trashList = r.trash; render(); }).catch(e => { trashList = []; toast(e.message); }); }
  return `<h2 class="sec-h">Recently deleted</h2><p class="sec-p">Deleted documents stay here for 30 days, then go for good.</p>
  <div class="card">${trashList === null ? '<p class="empty">Loading…</p>' : trashList.map(d => `<div class="it"><span class="ico" style="color:var(--muted)">${ic(d.type)}</span><span class="t"><b>${esc(d.number)} · ${esc(d.student || '')}</b><small>Deleted by ${esc(d.deletedBy)} · ${ago(d.deletedAt)}</small></span><button class="btn sm" data-restore="${d.id}">${ic('restore',14)} Restore</button></div>`).join('') || '<p class="empty">Nothing deleted in the last 30 days.</p>'}</div>`;
};

/* ================= events ================= */
function bind(){
  const on = (sel, fn) => document.querySelectorAll(sel).forEach(el => el.onclick = e => fn(el, e));
  on('[data-close]', () => closeSheet());
  on('[data-go]', (el, e) => { if(!e.target.closest('a')) location.href = el.dataset.go; });
  if($('attTog')) $('attTog').onclick = () => { attOpen = !attOpen; try{ localStorage.setItem('lhq_attOpen', attOpen ? '1' : '0'); }catch(e){} render(); };
  on('[data-mv]', el => { const [i, d] = el.dataset.mv.split(':').map(Number), a = myCards(); [a[i], a[i + d]] = [a[i + d], a[i]]; saveHome(a); });
  on('[data-rm]', el => { const a = myCards(); a.splice(+el.dataset.rm, 1); saveHome(a); });
  on('[data-add]', el => { const a = myCards(); if(a.length < 6) a.push(el.dataset.add); saveHome(a); });
  if($('sq')) $('sq').oninput = e => { sQ = e.target.value; $('slist').innerHTML = studentRows(HD.students(), route.args[0]); };
  if($('dq')) $('dq').oninput = e => { dQ = e.target.value; $('dlist').innerHTML = docRows(route.args[0] || 'all'); };
  if($('addStu')) $('addStu').onclick = () => newStudentSheet(false);
  // student details
  if($('sdEdit')) $('sdEdit').onclick = () => { editDetails = true; render(); };
  if($('sdCancel')) $('sdCancel').onclick = () => { editDetails = false; render(); };
  if($('sdSave')) $('sdSave').onclick = () => {
    const f = {}; HD.DETAIL.forEach(k => { const el = $('sd_' + k); if(el) f[k] = el.value; });
    if(!String(f.name || '').trim()){ toast('The student needs a name'); return; }
    const key = HD.saveStudent(route.args[0], f); editDetails = false; toast('Details saved. New documents use them.');
    if(key !== route.args[0]) location.hash = stuLink(key, 'details'); else render();
  };
  // account
  on('[data-layout]', el => { LHQNav.setLayout(el.dataset.layout); render(); toast(el.dataset.layout === 'side' ? 'Sidebar on this device' : 'Bottom bar on this device'); });
  if($('acStatus')) $('acStatus').innerHTML = `<span class="tag ${localStorage.getItem('lhq_syncDirty') === 'true' ? 'am">Saving changes' : 'ok">Everything saved online'}</span>`;
  if($('pinGo')) $('pinGo').onclick = async () => {
    const [a, b, c] = ['pin0','pin1','pin2'].map(i => $(i).value);
    if(b !== c){ toast('The new PINs don\'t match'); return; }
    try{ const r = await hub.api('people', {method:'POST', body:JSON.stringify({action:'mypin', current:a, pin:b})}); const s = hub.session(); s.token = r.token; localStorage.setItem('lhq_session', JSON.stringify(s)); ['pin0','pin1','pin2'].forEach(i => $(i).value = ''); toast('PIN changed. Other devices will ask for the new PIN.'); }
    catch(e){ toast(e.message); }
  };
  if($('outGo')) $('outGo').onclick = () => hub.signOut();
  // people
  if($('addPerson')) $('addPerson').onclick = () => {
    openSheet(`<div class="hx"><h3>${isDir() ? 'Add a person' : 'Add a tutor'}</h3><button class="ib" data-close>✕</button></div><p class="sp">They sign in by choosing their name and entering this PIN. They can change it afterwards.</p>
      <label class="f"><span>Full name</span><input class="in" id="np_name" autocomplete="off"></label>
      ${isDir() ? `<label class="f"><span>Role</span></label><div class="seg" id="np_role"><button class="on" data-r="tutor">Tutor</button><button data-r="admin">Admin</button></div><p class="note" style="margin:-4px 0 12px">New admins start with the default permissions, with money off. Change anything on their page.</p>` : ''}
      <label class="f"><span>First PIN (4 to 6 digits)</span><input class="in" id="np_pin" inputmode="numeric" maxlength="6"></label>
      <button class="btn n full" id="npGo">Add</button>`);
    bind();
    document.querySelectorAll('#np_role button').forEach(b => b.onclick = () => { document.querySelectorAll('#np_role button').forEach(x => x.classList.toggle('on', x === b)); });
    $('npGo').onclick = async () => { const role = (document.querySelector('#np_role .on') || {dataset:{r:'tutor'}}).dataset.r; const name = $('np_name').value.trim();
      if(await peopleCall({action:'add', name, role, pin:$('np_pin').value, tutor:role === 'tutor'}, `${name} added`)) closeSheet(); };
  };
  const pid = route.page === 'person' ? route.args[0] : null, P0 = pid && HD.people().find(x => x.id === pid);
  if(P0){
    on('[data-role]', el => { if(el.dataset.role !== P0.role) peopleCall({action:'access', id:pid, role:el.dataset.role}, `${first(P0.name)} is now ${el.dataset.role === 'admin' ? 'an Admin' : 'a Tutor'}`); });
    on('[data-teach]', () => peopleCall({action:'access', id:pid, tutor:!P0.tutor}, 'Saved'));
    on('[data-perm]', el => { const k = el.dataset.perm, has = (P0.perms || []).includes(k); const perms = has ? P0.perms.filter(x => x !== k) : (P0.perms || []).concat(k);
      const label = PERMS.flatMap(g => g[1]).find(x => x[0] === k)[1].toLowerCase();
      peopleCall({action:'access', id:pid, perms}, `Saved. ${first(P0.name)} ${has ? 'can no longer' : 'can now'}: ${label}`); });
    if($('permDefault')) $('permDefault').onclick = () => peopleCall({action:'access', id:pid, perms:['quotes','receipts','cards','delete','restore','students','tutors','msgs','classes']}, 'Defaults restored');
    if($('ppinGo')) $('ppinGo').onclick = () => peopleCall({action:'pin', id:pid, pin:$('ppin').value}, `New PIN set for ${first(P0.name)}`);
    if($('pOnOff')) $('pOnOff').onclick = () => { if(P0.active && !confirm(`Switch off ${P0.name}? They are signed out everywhere straight away.`)) return; peopleCall({action:P0.active ? 'off' : 'on', id:pid}, P0.active ? `${first(P0.name)} is switched off` : `${first(P0.name)} can sign in again`); };
    if($('pRemove')) $('pRemove').onclick = () => {
      openSheet(`<h3>Remove ${esc(P0.name)}?</h3><p class="sp">Their account is deleted and they can't sign in. Documents and logs they made stay, with their name on them. To stop access for now, Switch off is enough.</p><div class="acts"><button class="btn rd" id="rmGo">${ic('bin',16)} Remove</button><button class="btn" data-close>Keep</button></div>`);
      bind(); $('rmGo').onclick = async () => { if(await peopleCall({action:'remove', id:pid}, 'Account removed')){ closeSheet(); location.hash = '#set/people'; } };
    };
  }
  // settings sections
  on('[data-save]', el => { const f = {}; el.dataset.save.split(',').forEach(k => f[k] = $('c_' + k).value.trim()); saveSettings(f); });
  if($('numSave')) $('numSave').onclick = () => {
    const c = store.get('lhq_counters', {}), problems = [];
    ['quote','invoice','receipt','card'].forEach(t => { const n = parseInt($('n_' + t).value, 10); if(!n || n < 1){ problems.push(`${t}: enter a number`); return; }
      const used = usedMax(t); if(n <= used){ problems.push(`${fmtNo(t, n)} is already used (up to ${fmtNo(t, used)})`); return; } c[t] = n - 1; if(t === 'quote') store.set('lhq_lastnum', n - 1); });
    if(problems.length){ toast(problems[0]); return; }
    store.set('lhq_counters', c); toast('Numbering saved'); render();
  };
  on('[data-msg]', (el, e) => { e.preventDefault(); msgTab = el.dataset.msg; render(); });
  on('[data-var]', el => { const t = $('t_body'), s = t.selectionStart ?? t.value.length; t.value = t.value.slice(0, s) + el.dataset.var + t.value.slice(t.selectionEnd ?? s); t.focus(); t.selectionStart = t.selectionEnd = s + el.dataset.var.length; });
  if($('tplSave')) $('tplSave').onclick = () => { const t = store.get('lhq_templates', {}); t[msgTab] = $('t_body').value; if($('t_emailSubject')) t.emailSubject = $('t_emailSubject').value; store.set('lhq_templates', t); toast('Message saved'); };
  if($('tplReset')) $('tplReset').onclick = () => { if(!confirm('Put back the default wording for this message?')) return; const t = store.get('lhq_templates', {}); delete t[msgTab]; if(msgTab === 'emailBody') delete t.emailSubject; store.set('lhq_templates', t); render(); toast('Default wording restored'); };
  on('[data-lrm]', el => { const [k, i] = el.dataset.lrm.split(':'); const L = lines(settingsKV()[k]); L.splice(+i, 1); saveSettings({[k]: L.join('\n')}); render(); });
  on('[data-ladd]', el => { const k = el.dataset.ladd, v = $('la_' + k).value.trim(); if(!v) return; const L = lines(settingsKV()[k]); if(L.includes(v)){ toast('Already in the list'); return; } L.push(v); saveSettings({[k]: L.join('\n')}); render(); });
  document.querySelectorAll('[id^="la_"]').forEach(inp => inp.onkeydown = e => { if(e.key === 'Enter') document.querySelector(`[data-ladd="${inp.id.slice(3)}"]`).click(); });
  if($('clCopy')) $('clCopy').onclick = async () => { try{ await navigator.clipboard.writeText(new URL('checklist.html', location.href).href); toast('Link copied'); }catch(e){ toast('Copy didn\'t work here. Press and hold the link to copy it.'); } };
  if($('svcEmail')) checkServices();
  if($('codeSave')) $('codeSave').onclick = () => { localStorage.setItem('lhq_code', JSON.stringify($('accessCode').value.trim())); checkServices(); toast('Access code saved on this device'); };
  if($('bkGo')) $('bkGo').onclick = doBackup;
  if($('rsGo')) $('rsGo').onclick = () => $('restoreFile').click();
  on('[data-restore]', async el => { el.disabled = true; try{ const r = await hub.api('restore', {method:'POST', body:JSON.stringify({id:el.dataset.restore})}); trashList = trashList.filter(x => x.id !== el.dataset.restore); await hub.pull(); toast(`${r.doc.number} restored${r.renumbered ? ` (${r.renumbered} was taken, so it is now ${r.doc.number})` : ''}`); }catch(e){ el.disabled = false; toast(e.message); } });
}

/* sending services */
async function checkServices(){
  const set = (id, ok, text) => { const el = $(id); if(!el) return; el.className = 'svc ' + (ok ? 'ok' : 'warn'); el.querySelector('span').textContent = text; };
  const hasCode = !!store.get('lhq_code', '');
  const get = u => fetch(u, {cache:'no-store'}).then(r => r.json());
  const [em, wa] = await Promise.allSettled([get('/api/send-email'), get('/api/send-whatsapp')]);
  if(em.status === 'fulfilled' && em.value.configured) set('svcEmail', hasCode, hasCode ? `Email: ready. Sends from ${em.value.from}.` : `Email: connected to ${em.value.from}. Enter the access code below.`);
  else set('svcEmail', false, em.status === 'fulfilled' ? 'Email: not set up yet in Netlify.' : 'Email: the service isn\'t reachable right now.');
  if(wa.status === 'fulfilled' && wa.value.configured && wa.value.tokenOk) set('svcWa', hasCode, hasCode ? `WhatsApp: ready. Sends from ${wa.value.from || 'LHQ\'s number'}.` : 'WhatsApp: connected. Enter the access code below.');
  else set('svcWa', false, wa.status === 'fulfilled' ? (wa.value.configured ? 'WhatsApp: Meta rejected the access token. Check it in Netlify.' : 'WhatsApp: not set up yet in Netlify.') : 'WhatsApp: the service isn\'t reachable right now.');
}
/* backup: one file with every document and setting */
async function doBackup(){
  const data = {}; const SKIP = ['lhq_code','lhq_lastBackup','lhq_bkSnooze','lhq_session','lhq_syncBase','lhq_syncKv','lhq_syncRev','lhq_syncDirty','lhq_people','lhq_draft','lhq_layout','lhq_theme','lhq_attOpen'];
  for(let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if(k && k.startsWith('lhq_') && !SKIP.includes(k)){ try{ data[k] = JSON.parse(localStorage.getItem(k)); }catch(e){} } }
  const name = `LHQ-backup_${today()}.json`, text = JSON.stringify({app:'LHQ Quotes & Invoices', version:2, exportedAt:new Date().toISOString(), data});
  try{
    const f = new File([text], name, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[f]})){ try{ await navigator.share({files:[f], title:name}); }catch(e){ if(e && e.name === 'AbortError') return; throw e; } }
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type:'application/json'})); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }
    localStorage.setItem('lhq_lastBackup', JSON.stringify(Date.now())); toast(`Backed up ${saved.length} documents`); render();
  }catch(e){ toast('The backup didn\'t save. Try again.'); }
}
$('restoreFile').onchange = e => {
  const file = e.target.files[0]; e.target.value = ''; if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    let j; try{ j = JSON.parse(r.result); }catch(err){ toast('That file isn\'t an LHQ backup'); return; }
    if(!j || !j.data || !String(j.app || '').startsWith('LHQ')){ toast('That file isn\'t an LHQ backup'); return; }
    const byId = new Map(saved.map(d => [d.id, d])); let added = 0, newer = 0;
    (j.data.lhq_saved || []).forEach(d => { const cur = byId.get(d.id); if(!cur){ byId.set(d.id, d); added++; } else if((d.savedAt || 0) > (cur.savedAt || 0)){ byId.set(d.id, d); newer++; } });
    if(!added && !newer){ toast('Nothing to add: everything in the backup is already here'); return; }
    if(!confirm(`Add ${added} missing document${added === 1 ? '' : 's'}${newer ? ` and update ${newer} with a newer copy` : ''} from the backup?`)) return;
    store.set('lhq_saved', [...byId.values()].sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0)));
    toast(`Added from the backup. Uploading to LHQ Hub…`); render();
  };
  r.readAsText(file);
};

/* show a message left by the document page (for example after deleting) */
try{ const m = sessionStorage.getItem('lhq_flash'); if(m){ sessionStorage.removeItem('lhq_flash'); setTimeout(() => toast(m), 300); } }catch(e){}
render();
if(hub.session()) HD.refreshPeople().then(render);
</script>
